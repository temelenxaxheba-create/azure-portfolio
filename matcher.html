<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure Service Matcher | Temelenxaxheba</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #e6edf3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      max-width: 600px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #30363d;
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.25rem;
      color: #58a6ff;
    }

    .back-link {
      color: #8b949e;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back-link:hover {
      color: #58a6ff;
    }

    .scenario-box {
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      color: #58a6ff;
      background-color: rgba(88, 166, 255, 0.15);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .scenario-text {
      font-size: 1.1rem;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .service-btn {
      background-color: #21262d;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 14px 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .service-btn:hover:not(:disabled) {
      border-color: #58a6ff;
      background-color: #30363d;
    }

    .service-btn.correct {
      background-color: rgba(46, 160, 67, 0.2);
      border-color: #3fb950;
      color: #3fb950;
    }

    .service-btn.wrong {
      background-color: rgba(248, 81, 73, 0.2);
      border-color: #f85149;
      color: #f85149;
    }

    .feedback {
      margin-top: 16px;
      font-size: 0.95rem;
      color: #8b949e;
      min-height: 24px;
    }

    .next-btn {
      margin-top: 16px;
      width: 100%;
      padding: 12px;
      background-color: #238636;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }

    .next-btn:hover {
      background-color: #2ea043;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>⚡ Azure Service Matcher</h1>
      <a href="index.html" class="back-link">← Portfolio</a>
    </div>

    <div class="scenario-box">
      <div class="badge" id="counter">Scenario 1 of 5</div>
      <div class="scenario-text" id="scenario">Loading...</div>
    </div>

    <div class="grid" id="buttons"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="next-btn">Next Scenario →</button>
  </div>

  <script>
    const scenarios = [
      {
        text: "A company needs to store rarely accessed compliance backups for 7 years at the lowest possible cost.",
        options: ["Azure Archive Storage", "Azure SQL Database", "Azure Virtual Machines", "Azure CDN"],
        answer: "Azure Archive Storage",
        tip: "Archive tier offers the lowest storage cost for long-term data that can tolerate hours of retrieval time."
      },
      {
        text: "A developer wants to deploy a web app quickly without managing the underlying OS, patches, or servers.",
        options: ["Azure App Service", "Azure Virtual Network", "Azure Blob Storage", "Azure Firewall"],
        answer: "Azure App Service",
        tip: "Azure App Service is a PaaS offering that handles OS patching and infrastructure automatically."
      },
      {
        text: "An IT admin needs to enforce Single Sign-On (SSO) and Multi-Factor Authentication (MFA) for all employees.",
        options: ["Microsoft Entra ID", "Azure Monitor", "Azure Key Vault", "Azure DNS"],
        answer: "Microsoft Entra ID",
        tip: "Microsoft Entra ID (formerly Azure AD) is Azure's cloud identity and access management service."
      },
      {
        text: "A security team needs a centralized, encrypted vault to store API keys, passwords, and TLS certificates.",
        options: ["Azure Key Vault", "Azure Storage Queue", "Azure Bastion", "Azure Advisor"],
        answer: "Azure Key Vault",
        tip: "Azure Key Vault safeguards cryptographic keys, secrets, and certificates used by cloud apps."
      },
      {
        text: "An organization wants personalized recommendations to reduce unused Azure spending and improve security.",
        options: ["Azure Advisor", "Azure Policy", "Azure Sentinel", "Azure Bastion"],
        answer: "Azure Advisor",
        tip: "Azure Advisor analyzes your configurations and recommends cost, security, and reliability improvements."
      }
    ];

    let index = 0;
    const counterEl = document.getElementById("counter");
    const scenarioEl = document.getElementById("scenario");
    const buttonsEl = document.getElementById("buttons");
    const feedbackEl = document.getElementById("feedback");
    const nextBtn = document.getElementById("next-btn");

    function renderScenario() {
      const current = scenarios[index];
      counterEl.textContent = `Scenario ${index + 1} of ${scenarios.length}`;
      scenarioEl.textContent = current.text;
      feedbackEl.textContent = "";
      nextBtn.style.display = "none";
      buttonsEl.innerHTML = "";

      current.options.forEach(option => {
        const btn = document.createElement("button");
        btn.className = "service-btn";
        btn.textContent = option;
        btn.onclick = () => checkAnswer(btn, option);
        buttonsEl.appendChild(btn);
      });
    }

    function checkAnswer(clickedBtn, choice) {
      const current = scenarios[index];
      const allBtns = buttonsEl.querySelectorAll(".service-btn");

      allBtns.forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === current.answer) {
          btn.classList.add("correct");
        }
      });

      if (choice === current.answer) {
        feedbackEl.textContent = "✅ Spot on! " + current.tip;
      } else {
        clickedBtn.classList.add("wrong");
        feedbackEl.textContent = "❌ Not quite. " + current.tip;
      }

      nextBtn.textContent = index < scenarios.length - 1 ? "Next Scenario →" : "Start Over ↻";
      nextBtn.style.display = "block";
    }

    nextBtn.onclick = () => {
      index = (index + 1) % scenarios.length;
      renderScenario();
    };

    renderScenario();
  </script>

</body>
</html>
